[workspace]
resolver = "2"
members = ["crates/loopslcr-core", "crates/loopslcr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThrowingSnow/LOOP_SLCR"

[workspace.dependencies]
loopslcr-core = { path = "crates/loopslcr-core" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
