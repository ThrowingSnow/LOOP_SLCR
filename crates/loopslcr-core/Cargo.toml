[package]
name = "loopslcr-core"
description = "Exact loop-trimming core: rational bar math, WAV I/O, cut, foldback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
audioadapter-buffers = "2.0"
# Reference implementations, checked against in tests only. Neither is a runtime
# dependency, and for the same reason in both cases: the job needs something the
# library cannot do.
#
# hound cannot write acid/smpl chunks, which is why the reader and writer are
# our own. rubato cannot resample circularly, which a loop requires -- reading
# zeros past the ends drains energy from exactly the seam this tool exists to
# make seamless. Both stay as trusted second opinions, and the RIFF size-field
# bug is what that arrangement is worth.
hound = "3.5"
rubato = { version = "1.0", default-features = false }
